<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <section>
      <h1>Temperature Converter</h1>
      <p class="subtitle">Convert between Celsius, Fahrenheit and Kelvin.</p>

      <div class="field">
        <label for="temp">Temperature value</label>
        <input type="text" id="temp" inputmode="decimal" autocomplete="off" placeholder="e.g. 100" aria-describedby="hint">
        <div class="hint" id="hint" role="alert"></div>
      </div>

      <div class="field">
        <label for="unit">Convert from</label>
        <select id="unit">
          <option value="C">Celsius (°C)</option>
          <option value="F">Fahrenheit (°F)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </div>

      <button id="convert" type="button">Convert</button>

      <div class="message" id="message" role="alert"></div>

      <div class="results empty" id="results" aria-live="polite">
        <div class="row" id="row-C"><span class="name">Celsius</span><span class="value" id="out-C"></span></div>
        <div class="row" id="row-F"><span class="name">Fahrenheit</span><span class="value" id="out-F"></span></div>
        <div class="row" id="row-K"><span class="name">Kelvin</span><span class="value" id="out-K"></span></div>
      </div>
    </section>

    <aside class="gauge" aria-hidden="true">
      <span>150°</span>
      <div class="tube"><div class="mercury" id="mercury"></div></div>
      <div class="bulb"></div>
      <span>−50°</span>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
